<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body {
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f6f8fc; color:#0a0d14;
  display:flex; flex-direction:column; justify-content:center;
  padding:96px; position:relative;
}
.tag { font-size:34px; font-weight:700; color:#2f5fff; margin-bottom:36px; letter-spacing:1px; }
h1 { font-size:80px; font-weight:800; line-height:1.3; letter-spacing:-2px; margin-bottom:88px; }
.bubble { background:#fff; border:2px solid #e5e9f2; border-radius:28px;
  padding:44px 52px; margin-bottom:36px; box-shadow:0 4px 16px rgba(20,24,38,.05);
  display:flex; align-items:center; gap:36px; }
.bubble .emoji { font-size:64px; }
.bubble .txt { font-size:46px; font-weight:600; color:#1f2536; line-height:1.35; }
.bubble .txt small { display:block; font-size:34px; font-weight:500; color:#9aa4ba; margin-top:8px; }
.foot { position:absolute; bottom:88px; left:96px; right:96px;
  display:flex; justify-content:space-between; align-items:center; }
.foot .brand { font-size:30px; font-weight:700; letter-spacing:6px; color:#9aa4ba; }
.foot .page { font-size:30px; font-weight:600; color:#9aa4ba; }
</style>
</head>
<body>
  <div class="tag">클럽 운영의 현실</div>
  <h1>아직 이렇게<br>하고 계신가요?</h1>
  <div class="bubble"><div class="emoji">💬</div><div class="txt">단톡방 공지 300개 스크롤<small>"오늘 집합이 몇 시였더라…"</small></div></div>
  <div class="bubble"><div class="emoji">📋</div><div class="txt">엑셀 출석부 수기 정리<small>매주 훈련 끝나고 30분</small></div></div>
  <div class="bubble"><div class="emoji">🧾</div><div class="txt">입금 확인 문자 하나하나<small>"회비 입금하셨나요?"</small></div></div>
  <div class="foot"><div class="brand">TEAMPLUS</div><div class="page">2 / 5</div></div>
</body>
</html>
