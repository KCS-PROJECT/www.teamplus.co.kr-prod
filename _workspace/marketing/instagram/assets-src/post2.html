<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body {
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#0a0d14; color:#fff;
  position:relative;
}
/* 새벽 하늘 — 별 */
.star { position:absolute; border-radius:50%; background:#8fa3ff; }
.s1 { width:6px; height:6px; top:140px; left:180px; opacity:.7; }
.s2 { width:4px; height:4px; top:220px; left:820px; opacity:.5; }
.s3 { width:5px; height:5px; top:90px; left:560px; opacity:.6; }
.s4 { width:4px; height:4px; top:320px; left:340px; opacity:.4; }
.s5 { width:6px; height:6px; top:260px; left:950px; opacity:.6; }
.moon { position:absolute; top:120px; right:130px; width:88px; height:88px; border-radius:50%;
  background:transparent; box-shadow:-22px 10px 0 0 #dfe6ff; opacity:.85; }
.content { position:absolute; top:0; left:0; right:0; bottom:0;
  display:flex; flex-direction:column; justify-content:center; padding:104px; }
.time { font-size:44px; font-weight:600; color:#5b6a8f; letter-spacing:4px;
  font-variant-numeric:tabular-nums; margin-bottom:48px; }
h1 { font-size:96px; font-weight:800; line-height:1.34; letter-spacing:-2px; }
h1 .dim { color:#8fa3ff; }
.sub { margin-top:56px; font-size:46px; font-weight:500; color:#aab4cc; line-height:1.6; }
.line { margin-top:80px; width:120px; height:6px; border-radius:3px; background:#2f5fff; }
.closing { margin-top:40px; font-size:40px; font-weight:600; color:#e8ecf7; line-height:1.6; }
.closing b { color:#7d9bff; font-weight:800; }
.foot { position:absolute; bottom:88px; left:104px; right:104px;
  display:flex; justify-content:space-between; align-items:center; }
.foot .brand { font-size:30px; font-weight:700; letter-spacing:6px; color:#5b6a8f; }
.foot .handle { font-size:30px; font-weight:600; color:#5b6a8f; }
</style>
</head>
<body>
  <div class="star s1"></div><div class="star s2"></div><div class="star s3"></div>
  <div class="star s4"></div><div class="star s5"></div>
  <div class="moon"></div>
  <div class="content">
    <div class="time">AM 5:00</div>
    <h1>토요일 새벽 5시,<br>아이보다 먼저<br><span class="dim">일어나는 사람.</span></h1>
    <div class="sub">장비 가방을 싣고, 링크장으로.<br>단톡방을 다시 올려봅니다.<br>"오늘 집합이 몇 시였더라…"</div>
    <div class="line"></div>
    <div class="closing">하키 학부모의 매주가 조금 가벼워지도록,<br><b>팀플러스</b>가 만들고 있습니다.</div>
  </div>
  <div class="foot"><div class="brand">TEAMPLUS</div><div class="handle">@teamplus.kr</div></div>
</body>
</html>
