<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body {
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#141826; color:#fff;
  display:flex; flex-direction:column; justify-content:center;
  padding:96px; position:relative;
}
.tag { font-size:34px; font-weight:700; color:#7d9bff; margin-bottom:36px; letter-spacing:1px; }
h1 { font-size:84px; font-weight:800; line-height:1.28; letter-spacing:-2px; }
h1 .accent { color:#7d9bff; }
.list { margin:64px 0; }
.row { display:flex; align-items:center; gap:32px; padding:36px 0;
  border-bottom:2px solid #262d42; font-size:48px; font-weight:600; color:#e8ecf7; }
.row:last-child { border-bottom:none; }
.row .chk { color:#00d4a8; font-size:52px; font-weight:800; }
.cta { background:#2f5fff; border-radius:32px; padding:48px 56px; text-align:center; margin-bottom:120px; }
.cta .main { font-size:52px; font-weight:800; color:#fff; }
.cta .sub2 { margin-top:16px; font-size:36px; font-weight:500; color:#cdd9ff; }
.foot { position:absolute; bottom:88px; left:96px; right:96px;
  display:flex; justify-content:space-between; align-items:center; }
.foot .brand { font-size:30px; font-weight:700; letter-spacing:6px; color:#5b6a8f; }
.foot .page { font-size:30px; font-weight:600; color:#5b6a8f; }
</style>
</head>
<body>
  <div class="tag">회비 · 수강권</div>
  <h1>결제부터 집계까지,<br><span class="accent">앱에서 한 번에.</span></h1>
  <div class="list">
    <div class="row"><span class="chk">✓</span>회비·수강권 앱 결제</div>
    <div class="row"><span class="chk">✓</span>입금 확인 실랑이 없이 자동 집계</div>
    <div class="row"><span class="chk">✓</span>학부모·코치·감독 화면 따로</div>
  </div>
  <div class="cta">
    <div class="main">프로필 링크에서 다운로드 🏒</div>
    <div class="sub2">@teamplus.kr</div>
  </div>
  <div class="foot"><div class="brand">TEAMPLUS</div><div class="page">5 / 5</div></div>
</body>
</html>
