<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body {
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f6f8fc; color:#0a0d14;
  display:flex; flex-direction:column; justify-content:center;
  padding:96px; position:relative;
}
.tag { font-size:34px; font-weight:700; color:#2f5fff; margin-bottom:36px; letter-spacing:1px; }
h1 { font-size:84px; font-weight:800; line-height:1.28; letter-spacing:-2px; }
h1 .accent { color:#2f5fff; }
.big { margin:80px 0; text-align:center; }
.big .num { font-size:260px; font-weight:800; color:#2f5fff; letter-spacing:-8px; line-height:1;
  font-variant-numeric:tabular-nums; }
.big .unit { font-size:80px; font-weight:800; color:#2f5fff; }
.big .cap { margin-top:28px; font-size:44px; font-weight:600; color:#5b6577; }
.card { background:#fff; border:2px solid #e5e9f2; border-radius:28px; padding:48px 56px;
  box-shadow:0 4px 16px rgba(20,24,38,.05); display:flex; align-items:center; gap:32px; }
.card .ico { font-size:60px; }
.card .txt { font-size:44px; font-weight:600; color:#1f2536; line-height:1.4; }
.foot { position:absolute; bottom:88px; left:96px; right:96px;
  display:flex; justify-content:space-between; align-items:center; }
.foot .brand { font-size:30px; font-weight:700; letter-spacing:6px; color:#9aa4ba; }
.foot .page { font-size:30px; font-weight:600; color:#9aa4ba; }
</style>
</head>
<body>
  <div class="tag">일정 관리</div>
  <h1>이번 주 일정,<br><span class="accent">앱 열면 끝.</span></h1>
  <div class="big">
    <span class="num">3</span><span class="unit">초</span>
    <div class="cap">단톡방 스크롤 없이 일정 확인까지</div>
  </div>
  <div class="card"><div class="ico">🔔</div><div class="txt">일정이 바뀌면 <b>푸시 알림으로 바로.</b><br>놓치는 사람이 없습니다</div></div>
  <div class="foot"><div class="brand">TEAMPLUS</div><div class="page">3 / 5</div></div>
</body>
</html>
