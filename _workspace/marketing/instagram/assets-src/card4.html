<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css');
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:1080px; height:1350px; overflow:hidden; }
body {
  font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  background:#f6f8fc; color:#0a0d14;
  display:flex; flex-direction:column; justify-content:center;
  padding:96px; position:relative;
}
.tag { font-size:34px; font-weight:700; color:#2f5fff; margin-bottom:36px; letter-spacing:1px; }
h1 { font-size:84px; font-weight:800; line-height:1.28; letter-spacing:-2px; }
h1 .accent { color:#2f5fff; }
.qrbox { margin:80px auto; width:420px; height:420px; background:#fff;
  border:2px solid #e5e9f2; border-radius:48px; box-shadow:0 8px 32px rgba(20,24,38,.08);
  display:flex; align-items:center; justify-content:center; }
.qr { display:grid; grid-template-columns:repeat(9,32px); grid-template-rows:repeat(9,32px); gap:6px; }
.qr i { background:#141826; border-radius:6px; }
.qr i.b { background:#2f5fff; }
.qr i.o { background:transparent; }
.steps { display:flex; gap:24px; justify-content:center; align-items:center; }
.step { background:#fff; border:2px solid #e5e9f2; border-radius:24px; padding:36px 44px;
  font-size:40px; font-weight:700; color:#1f2536; }
.step.blue { background:#2f5fff; border-color:#2f5fff; color:#fff; }
.arrow { font-size:44px; color:#9aa4ba; font-weight:700; }
.cap { margin-top:56px; text-align:center; font-size:44px; font-weight:600; color:#5b6577; line-height:1.5; }
.foot { position:absolute; bottom:88px; left:96px; right:96px;
  display:flex; justify-content:space-between; align-items:center; }
.foot .brand { font-size:30px; font-weight:700; letter-spacing:6px; color:#9aa4ba; }
.foot .page { font-size:30px; font-weight:600; color:#9aa4ba; }
</style>
</head>
<body>
  <div class="tag">QR 출석</div>
  <h1>출석은<br><span class="accent">QR 한 번.</span></h1>
  <div class="qrbox"><div class="qr">
    <i></i><i></i><i></i><i class="o"></i><i class="b"></i><i class="o"></i><i></i><i></i><i></i>
    <i></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i></i>
    <i></i><i></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i><i></i><i></i>
    <i class="o"></i><i class="o"></i><i class="o"></i><i class="b"></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i>
    <i class="b"></i><i class="o"></i><i></i><i class="o"></i><i class="b"></i><i class="o"></i><i></i><i class="o"></i><i class="b"></i>
    <i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i><i class="b"></i><i class="o"></i><i class="o"></i><i class="o"></i>
    <i></i><i></i><i></i><i class="o"></i><i></i><i class="o"></i><i class="b"></i><i class="o"></i><i></i>
    <i></i><i class="o"></i><i></i><i class="o"></i><i class="o"></i><i class="o"></i><i class="o"></i><i></i><i class="o"></i>
    <i></i><i></i><i></i><i class="o"></i><i class="b"></i><i class="o"></i><i></i><i class="o"></i><i></i>
  </div></div>
  <div class="steps">
    <div class="step">아이가 QR 스캔</div>
    <div class="arrow">→</div>
    <div class="step blue">출석 자동 기록</div>
  </div>
  <div class="cap">출석부 정리도, 확인 전화도<br>이제 필요 없습니다</div>
  <div class="foot"><div class="brand">TEAMPLUS</div><div class="page">4 / 5</div></div>
</body>
</html>
